name: Public client checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: UI/package-lock.json
      - run: npm run setup
      - run: npm run check
      - run: npm test
      - run: npm run build
